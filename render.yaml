services:
  - type: web
    name: graphics-business-hq
    env: node
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: ANTHROPIC_API_KEY
        sync: false
