<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#EDD86A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background matching sidebar icon -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- ◈ symbol — diamond with inner circle and center dot -->
  <!-- Outer rotated square (diamond) -->
  <polygon points="32,8 56,32 32,56 8,32" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#0a0a0a" stroke-width="3.5"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#0a0a0a"/>
</svg>
