<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>

  <!-- Outer diamond (rotated square) -->
  <polygon points="32,6 58,32 32,58 6,32" fill="none" stroke="#7B61FF" stroke-width="3.5"/>

  <!-- Inner circle -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#7B61FF" stroke-width="3"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3.5" fill="#7B61FF"/>

  <!-- Corner tick marks -->
  <line x1="32" y1="6" x2="32" y2="12" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="32" x2="52" y2="32" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="58" x2="32" y2="52" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
